server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: flight-service
              uri: lb://flight-service
              predicates:
                - Path=/api/v1/flights/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            - id: passenger-service
              uri: lb://passenger-service
              predicates:
                - Path=/api/v1/passengers/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payment/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/